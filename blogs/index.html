    <!-- Script -->
    <script type="module" src="../script.js"></script>
    <script type="module">
        /**
         * Blog listing loader.
         * Fetches /blogs/posts-manifest.json (generated at build time by vite-plugin-md-blogs)
         * and renders an editorial table of posts.
         */

        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function loadBlogIndex() {
            const container = document.getElementById('blog-table');

            try {
                const res = await fetch('./posts-manifest.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const posts = await res.json();

                if (posts.length === 0) {
                    container.innerHTML = '<p class="blog-table-empty">No articles yet. Check back soon.</p>';
                    return;
                }

                container.innerHTML = '';

                posts.forEach((post) => {
                    const row = document.createElement('a');
                    row.className = 'blog-list-item';
                    row.href = `./${post.slug}/`;
                    row.setAttribute('role', 'listitem');
                    row.setAttribute('aria-label', post.title);

                    // Support both a tags array and a legacy single tag string
                    const tagsArr = Array.isArray(post.tags)
                        ? post.tags
                        : (post.tag ? [post.tag] : []);

                    const tagPills = tagsArr
                        .map(t => `<span class="bli-tag-pill">${escapeHTML(t)}</span>`)
                        .join('');

                    row.innerHTML = `
                        <span class="bli-title">${escapeHTML(post.title)}</span>
                        <span class="bli-meta">
                            <span class="bli-date">
                                <time datetime="${escapeHTML(post.date)}">${escapeHTML(post.dateLabel)}</time>
                            </span>
                            <span class="bli-tags">${tagPills}</span>
                        </span>
                    `;
                    container.appendChild(row);
                });
            } catch (err) {
                console.error('[blog-index]', err);
                container.innerHTML = '<p class="blog-table-empty">Could not load articles. Run <code>npm run build</code> first.</p>';
            }
        }

        loadBlogIndex();
    </script>
