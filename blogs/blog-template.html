<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
    <title>{{TITLE}} — Mohammad Shahnawaz</title>
    <meta name="description" content="{{EXCERPT}}">

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{TITLE}} — Mohammad Shahnawaz">
    <meta property="og:description" content="{{EXCERPT}}">
    <meta property="og:image" content="../../profile.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>

    <main class="column page">
        <a class="back" href="../">← All articles</a>
        <article>
            <h1>{{TITLE}}</h1>
            <div class="post-meta">
                <time class="meta" datetime="{{DATE}}">{{DATE_LABEL}}</time>
                <span class="meta">·</span>
                <span class="meta">{{READ_TIME}}</span>
                <span class="tag">{{TAG}}</span>
            </div>
            <div class="prose">
                {{BODY_HTML}}
            </div>
        </article>
        <footer><small>&copy; 2026 Mohammad Shahnawaz</small></footer>
    </main>

    <script type="module" src="../../script.js"></script>
</body>
</html>
